<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>マグニスさまがアイス食べるゲーム</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background: #f7eadb;
  color: #402d2a;
  touch-action: none;
}

#app {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.screen {
  width: min(100vw, 520px);
  height: min(100vh, 760px);
  position: relative;
  background: #fff8ee;
  overflow: hidden;
}

/* 共通 */

.hidden {
  display: none !important;
}

button {
  border: none;
  border-radius: 999px;
  padding: 14px 28px;
  font-size: 18px;
  font-weight: bold;
  background: #7a3f35;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.96);
}


/* タイトル */

#title {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}

#title h1 {
  font-size: 34px;
  line-height: 1.25;
  margin: 10px 0;
}

#title .ice-title {
  width: 150px;
  height: 150px;
  object-fit: contain;
}

#title .sub {
  margin: 5px 0 25px;
}


/* ゲーム */

#game {
  height: 100%;
  position: relative;
}

#field {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      #dff4f3 0 72%,
      #ead5bb 72% 100%
    );
}

#hud {
  position: absolute;
  top: 100px;
  left: 12px;
  right: 12px;

  display: flex;
  justify-content: space-between;

  z-index: 20;

  font-size: 15px;
  font-weight: bold;
}

#message {
  position: absolute;

  left: 50%;
  top: 100px;

  transform: translateX(-50%);

  z-index: 30;

  background: rgba(255,255,255,0.92);

  border-radius: 20px;

  padding: 7px 14px;

  white-space: nowrap;

  font-size: 13px;

  opacity: 0;

  transition: opacity 0.15s;
}

#message.show {
  opacity: 1;
}


/* マグニス */

#player {
  position: absolute;

  bottom: 15%;

  left: 50%;

  transform: translateX(-50%);

  width: 120px;
  height: 130px;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 10;

  user-select: none;
}

#player img {
  width: 100%;
  height: 100%;

  object-fit: contain;
}


/* 落ちてくるアイス */

.falling {
  position: absolute;

  width: 40px;
  height: 40px;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 5;

  user-select: none;
}

.falling img {
  width: 100%;
  height: 100%;

  object-fit: contain;
}


/* 操作説明 */

#guide {
  position: absolute;

  bottom: 10%;
  left: 50%;

  transform: translateX(-50%);

  font-size: 12px;

  opacity: 0.65;

  z-index: 15;

  white-space: nowrap;
}


/* 選択肢 */

#choice {
  position: absolute;

  inset: 0;

  background: rgba(45,31,28,0.5);

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 25px;
}

.choice-box {
  background: #fff8ee;

  border-radius: 24px;

  padding: 25px;

  width: 100%;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.2);

  text-align: center;
}

.choice-box h2 {
  margin: 0 0 10px;

  font-size: 24px;
}

.choice-box p {
  margin: 0 0 20px;

  line-height: 1.7;
}

.choice-buttons {
  display: flex;

  gap: 10px;
}

.choice-buttons button {
  flex: 1;
}

.choice-buttons .no {
  background: #999;
}


/* エンディング */

#ending {
  height: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  padding: 25px;

  text-align: center;
}

#ending .end-character {
  width: 180px;
  height: 180px;

  object-fit: contain;
}

#ending h2 {
  font-size: 30px;

  margin: 10px 0;
}

#ending p {
  line-height: 1.8;

  white-space: pre-line;
}

</style>
</head>


<body>

<div id="app">

<div class="screen">


<!-- ==================== -->
<!-- タイトル -->
<!-- ==================== -->

<section id="title">

  <!-- メインイラスト -->
  <img
    class="ice-title"
    src="mfice.JPG"
    alt="メインイラスト"
  >

  <h1>
    マグニスさまが<br>
    アイス食べるゲーム
  </h1>

  <p class="sub">
    フォシテス「本当に食べきれるのか？」<br>
    マグニス「うるせぇぞ。<br>俺様が食えると言えば食える！黙って見ていろ！」
  </p>

  <button id="startBtn">
    START
  </button>

</section>


<!-- ==================== -->
<!-- ゲーム -->
<!-- ==================== -->

<section id="game" class="hidden">

  <div id="field">

    <!-- マグニス -->
    <div id="player">

      <!-- マグニス画像 -->
      <img
        src="magnius.png"
        alt="マグニス"
      >

    </div>

  </div>


  <!-- スコア -->

  <div id="hud">

    <span>
      🍨
      <span id="score">0</span>
      / 20
    </span>

    <span>
      落とした：
      <span id="miss">0</span>
      / 5
    </span>

  </div>


  <div id="message"></div>


  <div id="guide">
    ← 左右にドラッグ →
  </div>

</section>


<!-- ==================== -->
<!-- フォシテス登場 -->
<!-- ==================== -->

<section id="choice" class="hidden">

  <div class="choice-box">

    <p>
     フォシテス「手伝ってやろうか？」<br><br>
      
    </p>

    <div class="choice-buttons">

      <button id="shareBtn">
        頼む…
      </button>

      <button
        id="aloneBtn"
        class="no"
      >
        うるせぇ！！
      </button>

    </div>

  </div>

</section>


<!-- ==================== -->
<!-- エンディング -->
<!-- ==================== -->

<section id="ending" class="hidden">

  <h2 id="endTitle"></h2>

  <p id="endText"></p>

  <button id="retryBtn">
    もう一度遊ぶ
  </button>
 <p>エンディング全3種類</p>

    
</section>


</div>
</div>


<script>

(() => {

  /* =====================================
     設定
  ===================================== */

  const TARGET_SCORE = 20;

  const FIRST_MISS_CHOICE = 3;

  const MAX_MISS = 5;

  /*
    アイスが落ちてくる間隔

  */
  const BASE_SPAWN_INTERVAL = 500;


  /*
    アイス画像5種類

  */

  const ICE_IMAGES = [

    "ice_01.PNG",
    "ice_02.PNG",
    "ice_03.PNG",
    "ice_04.PNG",
    "ice_05.PNG"

  ];


  /* =====================================
     HTML取得
  ===================================== */

  const title =
    document.getElementById("title");

  const game =
    document.getElementById("game");

  const ending =
    document.getElementById("ending");

  const choice =
    document.getElementById("choice");

  const field =
    document.getElementById("field");

  const player =
    document.getElementById("player");

  const scoreEl =
    document.getElementById("score");

  const missEl =
    document.getElementById("miss");

  const message =
    document.getElementById("message");

  const endTitle =
    document.getElementById("endTitle");

  const endText =
    document.getElementById("endText");

  const endCharacter =
    document.getElementById("endCharacter");


  /* =====================================
     ゲーム変数
  ===================================== */

  let score = 0;

  let miss = 0;

  let running = false;

  let askedShare = false;

  let playerX = 50;

  let items = [];

  let lastTime = 0;

  let spawnTimer = 0;

  let pointerActive = false;


  /* =====================================
     画面切り替え
  ===================================== */

  function show(el) {

    el.classList.remove("hidden");

  }


  function hide(el) {

    el.classList.add("hidden");

  }


  /* =====================================
     リセット
  ===================================== */

  function resetGame() {

    items.forEach(item => {

      item.el.remove();

    });

    items = [];

    score = 0;

    miss = 0;

    askedShare = false;

    playerX = 50;

    scoreEl.textContent = score;

    missEl.textContent = miss;

    player.style.left =
      playerX + "%";

  }


  /* =====================================
     ゲーム開始
  ===================================== */

  function startGame() {

    resetGame();

    hide(title);

    hide(ending);

    hide(choice);

    show(game);

    running = true;

    lastTime =
      performance.now();

    spawnTimer = 600;

    requestAnimationFrame(loop);

  }


  /* =====================================
     アイス生成
  ===================================== */

  function spawnIce() {

    const el =
      document.createElement("div");

    el.className =
      "falling";


    const img =
      document.createElement("img");


    /*
      5種類からランダム
    */

    const randomIndex =
      Math.floor(
        Math.random() *
        ICE_IMAGES.length
      );


    img.src =
      ICE_IMAGES[randomIndex];


    img.alt =
      "アイス";


    el.appendChild(img);


    /*
      横位置をランダム
    */

    const x =
      8 + Math.random() * 84;


    el.style.left =
      `calc(${x}% - 27px)`;


    el.style.top =
      "-60px";


    field.appendChild(el);


    items.push({

      el: el,

      x: x,

      y: -60,

      /*
        落下速度も少しランダム
      */

      speed:
        300 +
        Math.random() * 400
      

    });

  }


  /* =====================================
     メッセージ
  ===================================== */

  function flash(text) {

    message.textContent =
      text;

    message.classList.add(
      "show"
    );


    setTimeout(() => {

      message.classList.remove(
        "show"
      );

    }, 500);

  }


  /* =====================================
     当たり判定
  ===================================== */

  function hit(a, b) {

    const ar =
      a.getBoundingClientRect();

    const br =
      b.getBoundingClientRect();


    return (

      ar.left < br.right &&

      ar.right > br.left &&

      ar.top < br.bottom &&

      ar.bottom > br.top

    );

  }


  /* =====================================
     キャッチ
  ===================================== */

  function collect(item) {

    item.el.remove();

    items =
      items.filter(
        x => x !== item
      );


    score++;

    scoreEl.textContent =
      score;


    flash("キャッチ！");


    /*
      20点でTRUE END
    */

    if (
      score >= TARGET_SCORE
    ) {

      running = false;

      endGame("true");

    }

  }


  /* =====================================
     アイスを落とした
  ===================================== */

  function missItem(item) {

    item.el.remove();

    items =
      items.filter(
        x => x !== item
      );


    miss++;

    missEl.textContent =
      miss;


    flash(
      "クソッ！落ちた！"
    );


    /*
      3個落としたら
      フォシテス登場
    */

    if (
      miss === FIRST_MISS_CHOICE &&
      !askedShare
    ) {

      askedShare = true;

      running = false;

      show(choice);

      return;

    }


    /*
      5個落としたらBAD
    */

    if (
      miss >= MAX_MISS
    ) {

      running = false;

      endGame("bad");

    }

  }


  /* =====================================
     ゲームループ
  ===================================== */

  function loop(now) {

    if (!running) {

      return;

    }


    const dt =
      Math.min(
        (now - lastTime) / 1000,
        0.05
      );


    lastTime = now;


    spawnTimer -=
      dt * 1000;


    /*
      アイスをゆっくり出す
    */

    if (
      spawnTimer <= 0
    ) {

      spawnIce();


      /*
        だいたい1.3〜1.7秒に1個が400
      */

      spawnTimer =
        BASE_SPAWN_INTERVAL +
        Math.random() * 400;

    }


    const fieldRect =
      field.getBoundingClientRect();


    items.slice().forEach(
      item => {

        item.y +=
          item.speed * dt;


        item.el.style.top =
          item.y + "px";


        /*
          キャッチ
        */

        if (
          hit(
            item.el,
            player
          )
        ) {

          collect(item);

        }


        /*
          画面下まで落ちた
        */

        else if (
          item.y >
          fieldRect.height
        ) {

          missItem(item);

        }

      }
    );


    requestAnimationFrame(
      loop
    );

  }


  /* =====================================
     エンディング
  ===================================== */

  function endGame(type) {

    running = false;

    hide(game);

    hide(choice);

    show(ending);


    if (
      type === "bad"
    ) {

      endTitle.textContent =
        "BAD END";


      endText.textContent =
        "アイスを落としてしまった！\n\n" +
        "フォシテス「勿体無いことをするな💢」\n\n" +
        "マグニス「…………。」";


      /*
        フォシテス画像
      */

      endCharacter.src =
        "bad.JPG";

    }


    else if (
      type === "true"
    ) {

      endTitle.textContent =
        "TRUE END";


      endText.textContent =
        "5段アイス、完食！\n\n" +
        "マグニス「……腹が痛ぇ。」\n\n" +
        "フォシテス「全部一人で食べたからだぞ。」";


      endCharacter.src =
        "true.JPG";

    }


    else {

      endTitle.textContent =
        "HAPPY END";


      endText.textContent =
        "2人で仲良くアイスをシェア！\n\n" +
        "フォシテス「美味いな。」\n\n" +
        "マグニス「……ああ。」";


      endCharacter.src =
        "forcystus.png";

    }

  }


  /* =====================================
     マグニス移動
  ===================================== */

  function movePlayer(clientX) {

    const r =
      field.getBoundingClientRect();


    playerX =
      (
        (clientX - r.left) /
        r.width
      ) * 100;


    playerX =
      Math.max(
        8,
        Math.min(
          92,
          playerX
        )
      );


    player.style.left =
      playerX + "%";

  }


  /* =====================================
     スマホ操作
  ===================================== */

  field.addEventListener(
    "pointerdown",
    e => {

      pointerActive = true;

      field.setPointerCapture(
        e.pointerId
      );

      movePlayer(
        e.clientX
      );

    }
  );


  field.addEventListener(
    "pointermove",
    e => {

      if (
        pointerActive
      ) {

        movePlayer(
          e.clientX
        );

      }

    }
  );


  field.addEventListener(
    "pointerup",
    () => {

      pointerActive = false;

    }
  );


  field.addEventListener(
    "pointercancel",
    () => {

      pointerActive = false;

    }
  );


  /* =====================================
     PCの左右キー
  ===================================== */

  document.addEventListener(
    "keydown",
    e => {

      if (!running) {

        return;

      }


      if (
        e.key ===
        "ArrowLeft"
      ) {

        playerX -= 5;

      }


      if (
        e.key ===
        "ArrowRight"
      ) {

        playerX += 5;

      }


      playerX =
        Math.max(
          8,
          Math.min(
            92,
            playerX
          )
        );


      player.style.left =
        playerX + "%";

    }
  );


  /* =====================================
     ボタン
  ===================================== */

  document
    .getElementById(
      "startBtn"
    )
    .onclick =
      startGame;


  document
    .getElementById(
      "retryBtn"
    )
    .onclick =
      startGame;


  /*
    フォシテスに分ける
    ↓
    HAPPY END
  */

  document
    .getElementById(
      "shareBtn"
    )
    .onclick =
      () => {

        hide(choice);

        endGame("happy");

      };


  /*
    断る
    ↓
    ゲーム続行
  */

  document
    .getElementById(
      "aloneBtn"
    )
    .onclick =
      () => {

        hide(choice);

        running = true;

        lastTime =
          performance.now();

        requestAnimationFrame(
          loop
        );

      };


})();

</script>

</body>
</html>
